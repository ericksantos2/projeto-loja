services:
  # =========================================================
  # 1. BANCO DE DADOS (MySQL)
  # =========================================================
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: api_produtos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Garante que o MySQL está pronto para aceitar conexões antes de liberar o backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================================
  # 2. BACKEND (Spring Boot / Java 26 / Maven 3.9)
  # =========================================================
  backend:
    build: ./backend
    container_name: api_backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/api_produtos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/uploads:/app/uploads # Garante a persistência dos arquivos upados pelos usuários
    depends_on:
      db:
        condition: service_healthy # Aguarda o MySQL estar 100% pronto (healthcheck)

  # =========================================================
  # 3. FRONTEND (React / Vite / Node 26 / pnpm)
  # =========================================================
  frontend:
    build: ./frontend
    container_name: web_frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

# Volume persistente para o banco de dados
volumes:
  mysql_data:
  frontend_node_modules: