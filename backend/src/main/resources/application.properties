spring.application.name=api_produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

file.upload-dir=${UPLOAD_DIR:/app/uploads}

api.auth.jwt-secret=${JWT_SECRET}
api.auth.admin.username=${ADMIN_USERNAME:}
api.auth.admin.password=${ADMIN_PASSWORD:}
api.auth.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
api.auth.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
